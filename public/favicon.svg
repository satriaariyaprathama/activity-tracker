<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square in accent green (#2D5F4C) -->
  <rect width="512" height="512" rx="112" fill="#2D5F4C"/>

  <!-- 2×2 grid: represents the multi-view system (Dashboard, Day, Week, Month, Kanban)
       and the task status flow (Planned → In Progress → Done) -->

  <!-- Top-left: outline = "Planned" (not yet started) -->
  <rect x="124" y="124" width="116" height="116" rx="22"
        fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.4"/>

  <!-- Top-right: semi-filled = "In Progress" -->
  <rect x="272" y="124" width="116" height="116" rx="22"
        fill="#FFFFFF" opacity="0.35"/>

  <!-- Bottom-left: semi-filled = "In Progress" -->
  <rect x="124" y="272" width="116" height="116" rx="22"
        fill="#FFFFFF" opacity="0.35"/>

  <!-- Bottom-right: solid + checkmark = "Done" (the goal of activity tracking) -->
  <rect x="272" y="272" width="116" height="116" rx="22" fill="#FFFFFF"/>
  <path d="M298 330 L322 354 L368 302"
        fill="none" stroke="#2D5F4C" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
