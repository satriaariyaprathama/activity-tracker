<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123B86"/>
      <stop offset="100%" stop-color="#06142F"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1264FF"/>
      <stop offset="55%" stop-color="#20C8FF"/>
      <stop offset="100%" stop-color="#55F28A"/>
    </linearGradient>

    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1264FF"/>
      <stop offset="100%" stop-color="#55F28A"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Progress ring -->
  <path
    d="M392 198
       A154 154 0 1 0 374 329"
    fill="none"
    stroke="url(#ring)"
    stroke-width="34"
    stroke-linecap="round"
    filter="url(#shadow)"
  />

  <!-- Check -->
  <path
    d="M170 252 L222 304 L323 191"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Activity bars -->
  <rect x="286" y="305" width="40" height="88" rx="20" fill="url(#bars)"/>
  <rect x="343" y="263" width="40" height="130" rx="20" fill="url(#bars)"/>
  <rect x="400" y="211" width="40" height="182" rx="20" fill="url(#bars)"/>

  <!-- Bottom activity swoosh -->
  <path
    d="M125 393 C210 438 326 430 421 382"
    fill="none"
    stroke="url(#ring)"
    stroke-width="22"
    stroke-linecap="round"
  />
</svg>
